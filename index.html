<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#090a24">
  <meta name="description" content="为桃桃设计的英文与拼音启蒙小游戏">
  <title>桃桃的光之语言任务</title>
  <style>
    :root {
      --ink: #f7f5ff;
      --muted: #aab3d8;
      --cyan: #65e8ff;
      --violet: #a77aff;
      --gold: #ffd76a;
      --green: #61e4c3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #050617; }
    body {
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      overflow-x: hidden;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    .app {
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% -10%, rgba(71,104,255,.25), transparent 40%),
        linear-gradient(180deg,#0c0c30 0%,#07081f 55%,#050617 100%);
    }
    .app::before {
      content: "";
      position: fixed; inset: 0; z-index: -4;
      opacity: .52;
      background-image:
        linear-gradient(rgba(119,132,224,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(119,132,224,.035) 1px,transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom,transparent,black 24%,black 74%,transparent);
    }
    .glow {
      position: fixed; z-index: -3; width: 370px; height: 370px;
      border-radius: 50%; filter: blur(65px); opacity: .14; pointer-events: none;
    }
    .glow.one { left: -170px; top: 8%; background: #2bbfff; }
    .glow.two { right: -190px; bottom: 5%; background: #8d5bff; }
    .stars { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
    .stars i {
      position: absolute; display: block; border-radius: 50%; background: white;
      box-shadow: 0 0 10px rgba(132,228,255,.85);
      animation: twinkle 3.2s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity:.2; transform:scale(.7); }
      50% { opacity:.95; transform:scale(1.45); }
    }
    .screen {
      width: min(100%,720px); min-height: 100dvh; margin: 0 auto;
      padding: max(28px,env(safe-area-inset-top)) 22px max(25px,env(safe-area-inset-bottom));
      display: none; flex-direction: column; align-items: center;
    }
    .screen.active { display: flex; animation: screenIn .48s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes screenIn { from { opacity:0; transform:translateY(12px); } }
    .sound {
      position: fixed; top: max(18px,env(safe-area-inset-top)); right: max(18px,env(safe-area-inset-right));
      z-index: 20; width: 46px; height: 46px; border: 1px solid rgba(255,255,255,.12);
      border-radius: 15px; background: rgba(14,17,46,.68); color: white;
      font-size: 20px; backdrop-filter: blur(14px); cursor: pointer;
    }
    .pill {
      display: inline-flex; align-items:center; gap:8px; padding:7px 12px;
      border:1px solid rgba(255,255,255,.11); border-radius:999px;
      background:rgba(255,255,255,.06); color:#cad1ef; font-size:12px;
      font-weight:700; letter-spacing:.08em;
    }
    #home { justify-content:center; text-align:center; }
    .orbit {
      width:172px; height:172px; position:relative; margin:26px 0 21px;
      display:grid; place-items:center; border:1px solid rgba(122,216,255,.19);
      border-radius:50%;
    }
    .orbit::before,.orbit::after {
      content:""; position:absolute; inset:14px; border:1px solid rgba(157,128,255,.16);
      border-radius:50%; transform:rotate(35deg);
    }
    .orbit::after { inset:32px -7px; border-color:rgba(255,213,106,.15); transform:rotate(-25deg); }
    .orbit-dot {
      position:absolute; width:11px; height:11px; border-radius:50%;
      box-shadow:0 0 18px currentColor; animation:pulse 2.1s ease-in-out infinite;
    }
    .orbit-dot.a { top:9px; right:38px; color:var(--cyan); background:currentColor; }
    .orbit-dot.b { bottom:17px; left:26px; color:var(--violet); background:currentColor; animation-delay:.8s; }
    @keyframes pulse { 50% { transform:scale(1.45); opacity:.65; } }
    .emblem {
      width:102px; height:118px; position:relative; display:grid; place-items:center;
      border:2px solid rgba(158,234,255,.78); border-radius:48% 48% 43% 43%;
      background:linear-gradient(155deg,rgba(101,232,255,.4),transparent 34%),
                 linear-gradient(25deg,#4734b6,#161d58 58%,#263f8b);
      box-shadow:inset 0 0 25px rgba(101,232,255,.2),0 0 42px rgba(56,157,255,.25);
    }
    .emblem::before,.emblem::after {
      content:""; position:absolute; top:39px; width:31px; height:17px; background:var(--cyan);
      clip-path:polygon(0 0,100% 25%,72% 100%,0 55%); filter:drop-shadow(0 0 9px var(--cyan));
    }
    .emblem::before { left:10px; }
    .emblem::after { right:10px; transform:scaleX(-1); }
    .crown { position:absolute; top:9px; color:var(--gold); text-shadow:0 0 12px var(--gold); }
    .peach {
      position:relative; top:24px; width:43px; height:43px; display:grid; place-items:center;
      border:1px solid rgba(255,255,255,.7); border-radius:50%;
      background:linear-gradient(145deg,#ffb199,#ff719b); color:#411838;
      font-size:23px; font-weight:900; box-shadow:0 0 23px rgba(255,126,170,.55);
    }
    .kicker { margin:0 0 10px; color:var(--cyan); font-size:12px; font-weight:800; letter-spacing:.17em; }
    h1 { margin:0; font-size:clamp(34px,10vw,54px); line-height:1.12; letter-spacing:-.045em; }
    h1 span,.result h2 span {
      background:linear-gradient(90deg,#9cecff 5%,#bda3ff 52%,#ffe09a);
      background-clip:text; color:transparent;
    }
    .home-copy { margin:16px 0 22px; color:var(--muted); font-size:15px; line-height:1.75; }
    .worlds {
      width:min(100%,490px); display:grid; grid-template-columns:repeat(2,1fr);
      gap:10px; margin-bottom:20px;
    }
    .world {
      min-width:0; padding:12px; display:flex; align-items:center; gap:10px;
      border:1px solid; border-radius:18px; text-align:left;
    }
    .world.en {
      border-color:rgba(91,191,255,.58);
      background:linear-gradient(145deg,rgba(28,135,235,.5),rgba(16,52,121,.68));
      box-shadow:0 9px 24px rgba(29,126,224,.16);
    }
    .world.py { border-color:rgba(172,127,255,.25); background:linear-gradient(145deg,rgba(107,77,255,.22),rgba(38,23,89,.42)); }
    .world-icon {
      flex:0 0 auto; width:39px; height:39px; display:grid; place-items:center;
      border-radius:13px; background:rgba(255,255,255,.09); font-size:21px; font-weight:900;
    }
    .world b,.world small { display:block; }
    .world b { margin-bottom:3px; font-size:13px; }
    .world small { color:#99a5cc; font-size:10px; white-space:nowrap; }
    .primary {
      width:min(100%,490px); min-height:66px; position:relative; padding:10px 70px 10px 24px;
      border:0; border-radius:21px; background:linear-gradient(105deg,#2b83f5,#6256f8 55%,#965eea);
      color:white; text-align:left; box-shadow:0 16px 42px rgba(68,89,236,.27),inset 0 1px rgba(255,255,255,.35);
      cursor:pointer; transition:transform .18s ease;
    }
    .primary:active { transform:scale(.98); }
    .primary span,.primary b { display:block; }
    .primary span { margin-bottom:1px; color:rgba(255,255,255,.74); font-size:10px; letter-spacing:.07em; }
    .primary b { font-size:18px; }
    .primary i {
      position:absolute; top:50%; right:19px; width:38px; height:38px; display:grid; place-items:center;
      border-radius:13px; background:rgba(255,255,255,.16); font-size:21px; font-style:normal;
      transform:translateY(-50%);
    }
    .note { margin:13px 0 0; color:#747fa8; font-size:11px; }
    #mission { padding-top:max(20px,env(safe-area-inset-top)); }
    .mission-head {
      width:100%; display:grid; grid-template-columns:44px 1fr 44px; align-items:center;
      gap:12px; padding-right:54px;
    }
    .back {
      width:44px; height:44px; border:1px solid rgba(255,255,255,.1); border-radius:14px;
      background:rgba(255,255,255,.05); color:white; font-size:32px; cursor:pointer;
    }
    .energy-label { display:flex; justify-content:space-between; margin-bottom:6px; color:#b9c3e5; font-size:11px; }
    .energy-label b { color:var(--gold); font-size:13px; }
    .track { height:8px; overflow:hidden; border:1px solid rgba(255,255,255,.08); border-radius:999px; background:rgba(255,255,255,.06); }
    .track span {
      display:block; width:0; height:100%; border-radius:inherit;
      background:linear-gradient(90deg,#ef4559,#70e8ff 45%,#806cff 72%,#ffcf67);
      box-shadow:0 0 12px #75cbff;
      transition:width .65s cubic-bezier(.2,.8,.2,1);
    }
    .count { color:#8490b6; font-size:12px; font-weight:800; }
    .mentor {
      width:100%; margin:20px 0 12px; padding:11px 12px; display:flex; align-items:center; gap:11px;
      border:1px solid rgba(95,209,255,.14); border-radius:17px; background:rgba(20,31,76,.48);
    }
    .mentor-face {
      flex:0 0 auto; width:37px; height:37px; display:grid; place-items:center;
      border:1px solid rgba(118,229,255,.5); border-radius:50% 50% 43% 43%;
      background:radial-gradient(circle at 50% 72%,#6eebff 0 10%,transparent 11%),
                 linear-gradient(145deg,#f3f6ff 0 46%,#d83d51 47% 63%,#28356f 64%);
      color:var(--cyan);
    }
    .mentor p { min-width:0; flex:1; margin:0; }
    .mentor b,.mentor span { display:block; }
    .mentor b { margin-bottom:2px; font-size:12px; }
    .mentor span { color:#8f9ac1; font-size:10px; }
    .mentor button {
      width:35px; height:35px; border:0; border-radius:11px;
      background:rgba(255,255,255,.07); cursor:pointer;
    }
    .mission-card {
      width:100%; padding:22px 18px 19px; border:1px solid rgba(255,255,255,.1);
      border-radius:28px; background:linear-gradient(145deg,rgba(31,34,87,.83),rgba(12,14,44,.88));
      box-shadow:inset 0 1px rgba(255,255,255,.08),0 24px 65px rgba(0,0,0,.2);
      backdrop-filter:blur(18px);
    }
    .eyebrow { margin:0 0 17px; color:var(--cyan); font-size:10px; font-weight:800; letter-spacing:.12em; text-align:center; }
    .core {
      width:126px; height:126px; position:relative; margin:0 auto 18px; display:grid; place-items:center;
      border:1px solid rgba(102,225,255,.32); border-radius:50%;
      background:radial-gradient(circle at 40% 35%,rgba(139,239,255,.3),transparent 34%),
                 radial-gradient(circle,rgba(61,91,224,.45),rgba(21,24,72,.9) 70%);
      box-shadow:inset 0 0 34px rgba(115,217,255,.16),0 0 44px rgba(73,108,255,.19);
    }
    .core strong { z-index:2; font-size:clamp(32px,10vw,53px); line-height:1; letter-spacing:-.06em; }
    .core::before {
      content:""; position:absolute; inset:10px; border:1px dashed rgba(163,143,255,.3);
      border-radius:50%; animation:spin 12s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .mission-card h2 {
      min-height:54px; margin:0 0 17px; font-size:clamp(19px,5.5vw,26px);
      line-height:1.4; letter-spacing:-.02em; text-align:center;
    }
    .answers { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .answers.three { grid-template-columns:repeat(3,1fr); }
    .answer {
      min-width:0; min-height:132px; position:relative; padding:14px 9px 12px;
      border:1px solid rgba(255,255,255,.11); border-radius:20px;
      background:rgba(255,255,255,.045); color:var(--ink); text-align:center; cursor:pointer;
      transition:transform .16s ease,border-color .16s ease,background .16s ease;
    }
    .answer.en {
      border-color:rgba(91,187,255,.56);
      background:linear-gradient(145deg,rgba(34,139,239,.43),rgba(16,52,126,.62));
      box-shadow:inset 0 1px rgba(210,237,255,.13),0 8px 22px rgba(27,124,224,.17);
    }
    .answer.py {
      border-color:rgba(166,131,231,.24);
      background:linear-gradient(145deg,rgba(112,76,205,.22),rgba(52,31,94,.39));
    }
    .answer:active { transform:scale(.97); }
    .answer.right {
      border-color:#72efce; background:linear-gradient(145deg,rgba(42,211,166,.24),rgba(18,73,75,.35));
      box-shadow:0 0 20px rgba(83,237,198,.16);
    }
    .answer.retry { animation:shake .35s ease-in-out; border-color:rgba(255,204,105,.5); }
    @keyframes shake { 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
    .emoji { display:block; margin-bottom:7px; font-size:30px; }
    .answer b,.answer small { display:block; overflow:hidden; text-overflow:ellipsis; }
    .answer b { margin-bottom:3px; font-size:14px; }
    .answer small { color:#909dc6; font-size:9px; white-space:nowrap; }
    .feedback {
      width:100%; min-height:76px; margin-top:12px; padding:14px 16px;
      display:flex; align-items:center; gap:12px; border:1px solid rgba(255,255,255,.08);
      border-radius:20px; background:rgba(255,255,255,.035); color:#929dc1;
    }
    .feedback p { flex:1; margin:0; font-size:11px; line-height:1.5; }
    .feedback.good { border-color:rgba(93,231,194,.25); background:rgba(44,167,140,.09); color:#c8f7eb; }
    .feedback.retry-msg { border-color:rgba(255,213,106,.2); color:#f3d98b; }
    .next {
      flex:0 0 auto; min-height:44px; padding:0 13px; border:0; border-radius:13px;
      background:var(--green); color:#0a3c38; font-size:11px; font-weight:900; cursor:pointer;
    }
    #result { justify-content:center; text-align:center; }
    .ultra-celebration {
      position:fixed; inset:0; z-index:60; overflow:hidden; display:grid; place-items:center;
      background:radial-gradient(circle at 50% 40%,rgba(61,114,207,.62),transparent 34%),
                 radial-gradient(circle at 50% 50%,#172257 0,#080b26 68%,#03040f 100%);
      opacity:0; visibility:hidden; pointer-events:none;
    }
    #result.active .ultra-celebration { animation:ultraOverlay 3.9s ease forwards; }
    .ultra-flash {
      position:absolute; inset:0;
      background:radial-gradient(circle at 50% 44%,rgba(255,255,255,.98),rgba(111,224,255,.42) 22%,transparent 53%);
    }
    #result.active .ultra-flash { animation:ultraFlashPop 1.18s ease-out both; }
    .ultra-victory-ring {
      position:absolute; top:50%; left:50%; width:min(76vmin,520px); aspect-ratio:1;
      border:3px solid rgba(255,231,151,.86); border-radius:50%;
      box-shadow:0 0 42px rgba(255,222,110,.52),inset 0 0 52px rgba(103,132,255,.28);
    }
    #result.active .ultra-victory-ring { animation:ultraRingExpand 1.7s .15s ease-out both; }
    .ultra-celebration-hero {
      position:absolute; bottom:7%; left:50%; z-index:4; width:min(43vw,220px); height:min(68vh,510px);
      object-fit:contain; filter:drop-shadow(0 0 15px rgba(120,231,255,.92)) drop-shadow(0 0 34px rgba(103,123,255,.65));
    }
    #result.active .ultra-celebration-hero { animation:ultraHeroArrive 2.6s .12s cubic-bezier(.18,.86,.2,1) both; }
    .ultra-light-beam {
      position:absolute; top:44%; left:48%; z-index:3; width:min(82vw,620px); height:18px; border-radius:999px;
      background:linear-gradient(90deg,#fff,#79e6ff 25%,#ad94ff 58%,#ffe78b 82%,transparent);
      box-shadow:0 0 15px #fff,0 0 32px #72dfff; transform-origin:left center;
    }
    #result.active .ultra-light-beam { animation:ultraBeamSweep 1.45s .78s ease-out both; }
    .ultra-sparks { position:absolute; inset:0; z-index:5; }
    .ultra-sparks span {
      position:absolute; color:#fff1a6; font-size:clamp(19px,5vw,34px); text-shadow:0 0 14px currentColor;
    }
    #result.active .ultra-sparks span { animation:ultraSparkBurst 1.65s .7s ease-out both; }
    .ultra-sparks span:nth-child(1) { top:18%; left:14%; }
    .ultra-sparks span:nth-child(2) { top:28%; right:12%; color:#8eefff; animation-delay:.86s!important; }
    .ultra-sparks span:nth-child(3) { top:52%; left:9%; color:#a99dff; animation-delay:.98s!important; }
    .ultra-sparks span:nth-child(4) { top:60%; right:11%; animation-delay:1.08s!important; }
    .ultra-sparks span:nth-child(5) { top:10%; right:31%; color:#8eefff; animation-delay:1.16s!important; }
    .ultra-sparks span:nth-child(6) { top:73%; left:24%; color:#ff9dbd; animation-delay:1.24s!important; }
    .ultra-celebration > strong {
      position:absolute; bottom:8%; left:50%; z-index:6; color:#fff7d2; font-size:clamp(28px,8vw,48px);
      letter-spacing:.06em; text-shadow:0 2px 0 #544a92,0 0 16px rgba(255,234,158,.92); white-space:nowrap;
    }
    #result.active .ultra-celebration > strong { animation:ultraTitlePop 2.25s .46s both; }
    @keyframes ultraOverlay { 0%,77% { opacity:1; visibility:visible; } 100% { opacity:0; visibility:hidden; } }
    @keyframes ultraFlashPop { 0% { opacity:0; transform:scale(.25); } 30% { opacity:1; } 100% { opacity:.12; transform:scale(1.35); } }
    @keyframes ultraRingExpand {
      0% { opacity:0; transform:translate(-50%,-50%) scale(.12); }
      38% { opacity:1; }
      100% { opacity:.32; transform:translate(-50%,-50%) scale(1.26); }
    }
    @keyframes ultraHeroArrive {
      0% { opacity:0; transform:translate(-50%,22%) scale(.18); filter:brightness(3); }
      42% { opacity:1; transform:translate(-50%,0) scale(1.08); filter:brightness(1.8); }
      65%,100% { opacity:1; transform:translate(-50%,0) scale(1); }
    }
    @keyframes ultraBeamSweep {
      0% { opacity:0; transform:rotate(-9deg) scaleX(0); }
      24% { opacity:1; }
      74% { opacity:.96; transform:rotate(-9deg) scaleX(1); }
      100% { opacity:0; transform:rotate(-9deg) scaleX(1.1); }
    }
    @keyframes ultraSparkBurst {
      0% { opacity:0; transform:translateY(26px) scale(.2) rotate(-30deg); }
      45% { opacity:1; transform:translateY(-5px) scale(1.35) rotate(12deg); }
      100% { opacity:0; transform:translateY(-42px) scale(.72) rotate(45deg); }
    }
    @keyframes ultraTitlePop {
      0% { opacity:0; transform:translate(-50%,28px) scale(.5); }
      34%,78% { opacity:1; transform:translate(-50%,0) scale(1); }
      100% { opacity:0; transform:translate(-50%,-8px) scale(1.04); }
    }
    .badge-wrap { width:200px; height:200px; position:relative; margin:20px 0 16px; display:grid; place-items:center; }
    .rays {
      position:absolute; inset:8px; border-radius:50%;
      background:repeating-conic-gradient(from 8deg,rgba(255,215,106,.38) 0 3deg,transparent 3deg 19deg);
      animation:slowSpin 24s linear infinite;
    }
    @keyframes slowSpin { to { transform:rotate(360deg); } }
    .badge {
      width:132px; height:152px; position:relative; display:flex; flex-direction:column;
      align-items:center; justify-content:center; border:2px solid #ffe69d; border-radius:50% 50% 43% 43%;
      background:radial-gradient(circle at 36% 24%,rgba(255,255,255,.2),transparent 27%),
                 linear-gradient(145deg,#7660ef,#1c2d79 63%,#17204d);
      box-shadow:inset 0 0 24px rgba(119,231,255,.25),0 0 35px rgba(255,211,95,.28);
    }
    .badge::before { content:"✦"; position:absolute; top:10px; color:var(--gold); }
    .badge span { margin-top:13px; font-size:36px; }
    .badge b { margin:2px 0; font-size:20px; }
    .badge small { color:#c7d5ff; font-size:9px; }
    .result h2 { margin:0; font-size:clamp(29px,8vw,43px); line-height:1.2; letter-spacing:-.04em; }
    .result > p { margin:13px 0 20px; color:var(--muted); font-size:13px; line-height:1.7; }
    .summary {
      width:min(100%,490px); display:grid; grid-template-columns:1fr 24px 1fr;
      align-items:center; gap:5px; margin-bottom:16px;
    }
    .summary div { padding:13px 8px; border:1px solid rgba(255,255,255,.09); border-radius:17px; background:rgba(255,255,255,.045); }
    .summary span,.summary b,.summary small { display:block; }
    .summary b { font-size:12px; }
    .summary small { margin-top:2px; color:#8792b7; font-size:9px; }
    .secondary { min-height:40px; padding:0 20px; border:0; background:transparent; color:#7f89ac; font-size:11px; cursor:pointer; }
    @media(max-width:440px) {
      .orbit { width:144px; height:144px; margin:15px 0 16px; }
      .emblem { width:88px; height:102px; }
      .emblem::before,.emblem::after { top:35px; width:27px; }
      .peach { width:38px; height:38px; font-size:19px; }
      .home-copy { margin:11px 0 15px; }
      .mission-card { padding:18px 13px 14px; }
      .core { width:104px; height:104px; margin-bottom:14px; }
      .answer { min-height:116px; }
      .emoji { font-size:26px; }
    }
    .app.home-mode {
      color:var(--ink);
      background:
        radial-gradient(circle at 50% 12%,rgba(135,170,230,.18),transparent 34%),
        radial-gradient(circle at 10% 78%,rgba(231,83,94,.08),transparent 30%),
        linear-gradient(180deg,#18204a 0%,#111735 58%,#0c112a 100%);
    }
    .app.home-mode::before {
      opacity:.52;
      background-image:
        linear-gradient(rgba(119,132,224,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(119,132,224,.035) 1px,transparent 1px);
      background-size:48px 48px;
      mask-image:linear-gradient(to bottom,transparent,black 24%,black 74%,transparent);
    }
    .home-mode .glow { opacity:.08; filter:blur(65px); }

  <script>
    const missions = [
      {
        eyebrow:"任务 1 · 字母双身份", question:"M 在英文世界的朋友是谁？",
        instruction:"先看蓝色的英文能量门", prompt:"M",

        answers:[
          {label:"Apple",sub:"A → Apple",emoji:"🍎",correct:true,world:"en"},
          {label:"Cat",sub:"C → Cat",emoji:"🐱",correct:false,world:"en"},

      {

        helper:"拼音里，m 和 a 可以合成 ma；加上一声就是 mā。", voice:"任务三。拼音合体。m 和 a 合起来是什么？",
        answers:[
          {label:"mā",sub:"m + a → mā 妈",emoji:"👩",correct:true,world:"py"},
          {label:"M",sub:"英文字母 M",emoji:"🔤",correct:false,world:"en"}
        ]
      },
      {
        eyebrow:"任务 4 · 光之判断", question:"看到“阿姨”的拼音 a，要走哪扇门？",
        instruction:"想一想：它在帮汉字发音", prompt:"a → 阿姨",
        helper:"拼音 a 帮助我们读汉字；英文 A 可以组成 Apple。", voice:"最终任务。看到阿姨的拼音 a，要走哪一扇门？",
        answers:[
          {label:"英文能量门",sub:"A → Apple",emoji:"🔵",correct:false,world:"en"},
          {label:"拼音能量门",sub:"a → 阿姨",emoji:"🟣",correct:true,world:"py"}
        ]
      }
    ];
    let index = 0, energy = 0, muted = false, locked = false, heroTransformed = false;
    const $ = id => document.getElementById(id);
    const show = id => {
      document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active",s.id===id));
      document.querySelector(".app").classList.toggle("home-mode",id==="home");
      window.scrollTo(0,0);

    function friendlyChineseVoice() {
      if (!("speechSynthesis" in window)) return;
      const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith("zh"));
      const score=v=>{
        const name=v.name.toLowerCase();
        let value=v.lang.toLowerCase()==="zh-cn"?50:20;
        if(/natural|premium|online|neural/.test(name)) value+=40;
        if(/xiaoxiao|xiaoyi|tingting|ting-ting|yu-shu|meijia|mei-jia|sinji|sin-ji|婷婷|晓晓|小艺|美佳|善怡/.test(name)) value+=90;
        if(/yunxi|yunyang|eddy|reed|rocko|grandpa|male|sandy|flo|shelley/.test(name)) value-=120;
        if(!v.localService) value+=8;
        return value;
      };
      return voices.sort((a,b)=>score(b)-score(a))[0];
    }
    function speak(text,mood="guide") {
      if (muted || !("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const connectedText=text.replace(/[，。！？；：、,.!?;:]/g," ").replace(/\s+/g," ").trim();
      const u = new SpeechSynthesisUtterance(connectedText);
      u.lang="zh-CN";
      const voice=friendlyChineseVoice();
      if(voice) u.voice=voice;
      u.rate=mood==="gentle"?.96:.99;
      u.pitch=1; u.volume=.94;
      speechSynthesis.speak(u);
    }
    function successChime() {
      if(muted) return;
      const AudioContextClass=window.AudioContext||window.webkitAudioContext;
      if(!AudioContextClass) return;
      const audio=new AudioContextClass(), gain=audio.createGain();
      gain.gain.setValueAtTime(.0001,audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(.12,audio.currentTime+.02);
      gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.62);
      gain.connect(audio.destination);
      [523.25,659.25,783.99].forEach((frequency,i)=>{
        const tone=audio.createOscillator();
        tone.type="sine"; tone.frequency.value=frequency; tone.connect(gain);
        tone.start(audio.currentTime+i*.12); tone.stop(audio.currentTime+.32+i*.12);
      });
      setTimeout(()=>audio.close(),750);
    }
    function render() {
      const m = missions[index];
      locked = false;
      $("count").textContent = `${index+1}/${missions.length}`;
      $("energyNumber").textContent = energy;
      $("energyBar").style.width = energy+"%";
      $("instruction").textContent = m.instruction;
      $("eyebrow").textContent = m.eyebrow;
      $("prompt").textContent = m.prompt;
      $("question").textContent = m.question;
      $("answers").className = "answers"+(m.answers.length===3?" three":"");
      $("answers").innerHTML = m.answers.map((a,i)=>`
        <button class="answer ${a.world}" data-index="${i}">
          <span class="emoji">${a.emoji}</span><b>${a.label}</b><small>${a.sub}</small>
        </button>`).join("");
      $("feedback").className="feedback";
      $("feedback").innerHTML="<p>💡 看颜色也能找到线索</p>";
      $("answers").querySelectorAll(".answer").forEach(btn=>btn.addEventListener("click",()=>choose(Number(btn.dataset.index),btn)));
      setTimeout(()=>speak(m.voice),420);
    }
    function choose(i,btn) {
      if (locked) return;
      const m=missions[index], a=m.answers[i];
      if (!a.correct) {
        btn.classList.add("retry");
        $("feedback").className="feedback retry-msg";
        $("feedback").innerHTML="<p>🌟 差一点点，换一扇门试试</p>";
        speak("没关系呀，我们慢慢来，再找一找。","gentle");
        setTimeout(()=>{btn.classList.remove("retry");$("feedback").className="feedback";$("feedback").innerHTML="<p>💡 看颜色也能找到线索</p>";},900);
        return;
      }
      locked=true; btn.classList.add("right"); energy=Math.min(100,energy+25);
      $("energyNumber").textContent=energy; $("energyBar").style.width=energy+"%";
      $("feedback").className="feedback good";
      $("feedback").innerHTML=`<p>✨ <b>光能量 +25</b> ${m.helper}</p><button class="next" id="next">${index===missions.length-1?"领取徽章":"下一项任务"} →</button>`;
      successChime();
      setTimeout(()=>speak("嗯，答对啦。桃桃真棒。","gentle"),360);
      $("next").addEventListener("click",()=>{
        if(index===missions.length-1){
          show("result"); successChime();
          setTimeout(()=>speak("全部答题完成，迪迦来为桃桃庆祝啦。","gentle"),520);
        }
        else {index++;render();}
      });
    }
    function begin() { index=0;energy=0;show("mission");render();speak("桃桃准备好了吗 光之变身 一起出发吧","gentle"); }
    function transformHero() {
      if(heroTransformed) return;
      heroTransformed=true;
      $("heroMorph").classList.add("is-tiga");
      $("heroMorph").setAttribute("aria-pressed","true");
      $("heroMorph").setAttribute("aria-label","迪迦形态已出现");
      $("heroStage").classList.add("is-tiga-stage");
      $("heroSpeech").textContent="迪迦登场！";
      successChime();
      setTimeout(()=>speak("迪迦登场，光之变身完成啦。","gentle"),220);
    }
    $("heroMorph").addEventListener("click",transformHero);
    $("start").addEventListener("click",begin);
    $("again").addEventListener("click",begin);
    $("back").addEventListener("click",()=>{speechSynthesis?.cancel();show("home");});
    $("resultHome").addEventListener("click",()=>show("home"));
    $("voice").addEventListener("click",()=>speak(missions[index].voice));
    $("sound").addEventListener("click",()=>{
      muted=!muted; $("sound").textContent=muted?"🔇":"🔊";
      $("sound").setAttribute("aria-label",muted?"打开声音":"关闭声音");
      speechSynthesis?.cancel();
    });
    const stars=$("stars");
    for(let i=0;i<18;i++){
      const s=document.createElement("i");
      s.style.left=((i*37+7)%96)+"%";s.style.top=((i*53+4)%92)+"%";
      const size=i%3===0?4:2;s.style.width=size+"px";s.style.height=size+"px";
      s.style.animationDelay=((i%6)*.55)+"s";stars.appendChild(s);
    }
  </script>
</body>
</html>
